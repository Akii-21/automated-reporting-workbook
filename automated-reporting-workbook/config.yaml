# Automated Reporting Workbook — configuration
# Point this at any tabular sales/orders dataset (e.g. from Kaggle) by editing
# the "columns" mapping below to match your file's headers. Nothing else in
# the code needs to change.

report_title: "Sales Performance Report"
currency_symbol: "$"

# Map the pipeline's internal field names -> your CSV's actual column names.
columns:
  date: "Order Date"
  category: "Category"
  sub_category: "Sub Category"
  region: "Region"
  segment: "Segment"
  sales: "Sales"
  profit: "Profit"
  quantity: "Quantity"
  order_id: "Order ID"

# How many rows to show in "Top N" tables/charts
top_n: 5

output:
  excel_filename: "sales_report.xlsx"
  html_filename: "sales_report.html"
